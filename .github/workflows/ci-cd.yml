name: CI/CD API

# PR vers master  → qualité uniquement (typecheck, build, tests).
# Push sur master → qualité, puis image Docker, puis déploiement sur le VPS.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  # On n'annule jamais un déploiement en cours ; seulement les PR obsolètes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: kysaymeric/pavillon-les-lys

jobs:
  # ============================================================
  # 1. Qualité — typecheck + build + tests unitaires (toujours)
  # ============================================================
  quality:
    name: Typecheck, Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint "src/**/*.ts"
        continue-on-error: true

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test:unit

  # ============================================================
  # 2. Build & push de l'image (push master / déclenchement manuel)
  # ============================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tags
        id: tags
        run: echo "sha_tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 3. Déploiement sur le VPS
  #    Sauvegarde BDD → pull → restart → attente « healthy »
  #    → rollback automatique sur l'image précédente en cas d'échec.
  #    Les migrations Prisma sont appliquées au démarrage du conteneur
  #    (CMD : prisma migrate deploy && node dist/main).
  # ============================================================
  deploy:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          DEPLOY_DIR: ${{ secrets.VPS_API_DEPLOY_DIR }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          ssh -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "DEPLOY_DIR='${DEPLOY_DIR}' IMAGE_TAG='${IMAGE_TAG}' bash -s" << 'ENDSSH'
            set -euo pipefail
            cd "${DEPLOY_DIR}"

            # Lecture de quelques variables du .env (jamais affiché : il contient des secrets).
            env_get() { grep "^$1=" .env | tail -1 | cut -d= -f2-; }
            PREV_TAG="$(env_get IMAGE_TAG || true)"
            DB_USER="$(env_get POSTGRES_USER)"
            DB_NAME="$(env_get POSTGRES_DB)"

            set_tag() {
              if grep -q '^IMAGE_TAG=' .env; then
                sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$1|" .env
              else
                echo "IMAGE_TAG=$1" >> .env
              fi
            }

            echo "💾 Sauvegarde de la base avant déploiement…"
            mkdir -p backups
            BACKUP="backups/pre-deploy-${IMAGE_TAG}-$(date +%Y%m%d-%H%M%S).sql.gz"
            docker compose exec -T postgres pg_dump -U "${DB_USER}" -d "${DB_NAME}" | gzip > "${BACKUP}"
            chmod 600 "${BACKUP}"
            # On garde les 15 sauvegardes de déploiement les plus récentes.
            ls -1t backups/pre-deploy-*.sql.gz 2>/dev/null | tail -n +16 | xargs -r rm -f
            echo "✅ ${BACKUP}"

            echo "📥 Pull de l'image ${IMAGE_TAG} (précédente : ${PREV_TAG:-aucune})…"
            set_tag "${IMAGE_TAG}"
            docker compose pull api

            echo "🚀 Redémarrage de l'API…"
            docker compose up -d api

            echo "⏳ Attente de l'état healthy (migrations + démarrage)…"
            CID="$(docker compose ps -q api)"
            STATUS="starting"
            for i in $(seq 1 24); do
              STATUS="$(docker inspect -f '{{.State.Health.Status}}' "${CID}" 2>/dev/null || echo unknown)"
              [ "${STATUS}" = "healthy" ] && break
              sleep 10
            done

            if [ "${STATUS}" != "healthy" ]; then
              echo "❌ L'API n'est pas healthy (${STATUS}). Derniers logs :"
              docker compose logs --tail 80 api || true
              if [ -n "${PREV_TAG}" ]; then
                echo "↩️ Rollback vers ${PREV_TAG}…"
                set_tag "${PREV_TAG}"
                docker compose up -d api
              fi
              exit 1
            fi

            echo "🧹 Nettoyage des images obsolètes…"
            docker image prune -f

            echo "✅ API déployée (tag : ${IMAGE_TAG})."
          ENDSSH

      - name: Smoke test public
        run: |
          for i in $(seq 1 6); do
            if curl -fsS https://api.pavillonleslys.ci/health; then exit 0; fi
            sleep 10
          done
          echo "❌ https://api.pavillonleslys.ci/health ne répond pas"
          exit 1
