name: CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # 1. Quality — lint + build (toujours)
  # ============================================================
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

  # ============================================================
  # 2. Build & push image Docker (uniquement push develop/master)
  # ============================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${OWNER_LC}/pavillon-les-lys" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "sha_tag=prod-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "image_tag=dev" >> $GITHUB_OUTPUT
            echo "sha_tag=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.env.outputs.image_name }}:${{ steps.env.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.env.outputs.image_name }}:${{ steps.env.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 3. Deploy sur VPS (uniquement push develop/master)
  # ============================================================
  deploy:
    name: Deploy (${{ needs.build-and-push.outputs.env_name }})
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          ENV_NAME: ${{ needs.build-and-push.outputs.env_name }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          ssh -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "ENV_NAME='${ENV_NAME}' GHCR_PAT='${GHCR_PAT}' bash -s" << 'ENDSSH'
            set -e

            # Chemin du dossier docker-compose selon l'environnement
            case "${ENV_NAME}" in
              dev)  DEPLOY_DIR="/home/Rico/pavillon-lys-api" ;;
              prod) DEPLOY_DIR="/home/Rico/pavillon-lys-api-prod" ;;
              *)    echo "❌ ENV_NAME inconnu: ${ENV_NAME}"; exit 1 ;;
            esac
            cd "${DEPLOY_DIR}"

            # Login GHCR (uniquement si PAT fourni — image privée)
            if [ -n "${GHCR_PAT}" ]; then
              echo "${GHCR_PAT}" | docker login ghcr.io -u stephk68 --password-stdin
            fi

            echo "📥 Pull de la dernière image…"
            docker compose pull api

            echo "🚀 Redémarrage de la stack…"
            docker compose up -d --remove-orphans

            echo "⏳ Attente du démarrage de l'API…"
            sleep 10

            echo "📦 Exécution des migrations Prisma…"
            docker compose exec -T api npx prisma migrate deploy

            echo "🌱 Seed admin (idempotent)…"
            docker compose exec -T api node prisma/seed.prod.js

            echo "🧹 Nettoyage des images obsolètes…"
            docker image prune -f

            echo "✅ Déploiement ${ENV_NAME} terminé."
          ENDSSH
